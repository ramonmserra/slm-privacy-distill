[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# Testes que consomem LLM de verdade (custam dinheiro e sao nao-deterministicos)
# ficam fora da execucao padrao. Rodar com: pytest -m llm
markers =
    llm: exige credencial de LLM e faz chamadas reais (custa dinheiro)
    lento: leva dezenas de segundos ou mais; para o ciclo rapido use: pytest -m "not lento"
addopts = -m "not llm" -q
